function announce(){const a=data.ann||[];ai%=Math.max(1,a.length);const x=a[ai];const key=JSON.stringify([x,ai,a.length]);if(key===lastAnn)return;lastAnn=key;$('ap').textContent=x?`${ai+1} / ${a.length}`:'';const end=x?.end?String(x.end).slice(0,10).replace(/^\d{4}-/,'').replace('-','月')+'日':'';$('ann').innerHTML='<div class="anncontent">'+(x?`<div class="tag">${esc(x.category||'最新消息')}</div><strong>${esc(x.title)}</strong><p>${esc(x.body)}</p>${end?`<small>${calIcon} 公告至｜${esc(end)}</small>`:''}`:'<div class="tag">最新消息</div><strong>目前無新公告</strong><p>請共同維護校園環境。</p>')+'</div><div class="annpages">'+a.map((_,i)=>`<i class="${i===ai?'on':''}"></i>`).join('')+'</div>';spring($('ann').querySelector('.anncontent'));}

function ranks(){const g=grades[gi%3];$('stitle').textContent=data.title||'整潔競賽';$('week').textContent=data.subtitle?data.subtitle:(data.week&&data.end?`${data.week.slice(5).replace('-','.')} — ${data.end.slice(5).replace('-','.')}`:'');$('grade').textContent='高'+g+'榮譽榜';$('dots').innerHTML=grades.map((_,i)=>`<i class="${i===gi%3?'on':''}"></i>`).join('');const r=data.ranking?.[g]||{};const key=JSON.stringify([g,r.top,data.calculating]);if(key!==lastRank){lastRank=key;if(data.calculating){$('rank').innerHTML='<div class="wait">計算中，請稍候</div>'}else{if(!$('rank').querySelector('.artframe'))$('rank').innerHTML='<div class="podium-art"><div class="artframe"><div class="winner w2"></div><div class="winner w1"></div><div class="winner w3"></div></div></div>';[2,1,3].forEach((n,i)=>{const names=(r.top||[]).filter(x=>+x.rank===n).map(x=>full(x.cls));const el=$('rank').querySelector('.w'+n);el.innerHTML=names.map(esc).join('<br>')||'—';el.classList.toggle('multi',names.length>1);spring(el,n===1?0:65+i*25)});spring($('grade'));}}const rest=data.calculating?null:(data.ranking?.[g]?.rest||[]),bottom=JSON.stringify([g,rest]);if(bottom!==lastBottom){lastBottom=bottom;$('bottom').innerHTML=data.calculating?'':`<h3>高${g}　第 4 名起</h3><div class="restgrid">`+(rest.length?rest.map(x=>`<span><b>${esc(x.rank)}</b>${esc(full(x.cls))}</span>`).join(''):'<span class="none">暫無資料</span>')+'</div>';spring($('bottom').querySelector('.restgrid'));}}
function cards(){const a=isStale?[]:(data.cards||[]),pages=Math.max(1,Math.ceil(a.length/4));ci%=pages;const slice=a.slice(ci*4,ci*4+4),key=JSON.stringify([slice,ci,pages]);if(key===lastCards)return;lastCards=key;$('cp').textContent=`${String(ci+1).padStart(2,'0')} / ${String(pages).padStart(2,'0')}`;$('cards').innerHTML=Array.from({length:4},(_,i)=>{const r=slice[i];return r?`<div class="red ${r.void?'void':''}"><div class="warning" aria-hidden="true"></div><div class="redtext"><b>${esc(full(r.cls))}${r.void?'・已撤銷':''}</b><small><span>${calIcon}${esc(r.time)}</span><span>${pinIcon}${esc(r.place)}</span></small><p>${esc(r.reason)}</p></div></div>`:'<div class="red empty"><b>校園整潔提醒</b><p>隨手維護公共空間</p></div>'}).join('');$('cards').querySelectorAll('.red').forEach((el,i)=>spring(el,i*75));}
function clock(){const d=new Date();$('date').textContent=d.toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',weekday:'short'});$('clock').textContent=d.toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false})}clock();setInterval(clock,1000);const STORE='sanitary-board-v6-config:'+location.pathname;let config;try{config=JSON.parse(localStorage.getItem(STORE))}catch{}function setup(){ $('setup').style.display='grid';$('url').value=config?.url||'';$('key').value=config?.key||''}if(!config||new URLSearchParams(location.search).has('setup'))setup();$('connect').onsubmit=e=>{e.preventDefault();try{const u=new URL($('url').value.trim());if(u.origin!=='https://script.google.com'||!/^\/macros\/s\/[\w-]+\/exec$/.test(u.pathname)||u.username||u.password||u.search||u.hash)throw Error('請貼上 Apps Script /exec 原始網址');const key=$('key').value.trim();if(!key)throw Error('請填入讀取金鑰');localStorage.setItem(STORE,JSON.stringify({url:u.href,key}));location.href=location.pathname}catch(e){alert(e.message)}};
function healthStatus(){const stamp=String(data.updated||''),parsed=Date.parse(stamp.replace(' ','T')+'+08:00'),stale=!Number.isFinite(parsed)||Date.now()-parsed>Math.max(300000,(Number(data.syncMinutes||1)+3)*60000)||Date.now()-lastContact>300000;if(stale!==isStale){isStale=stale;ci=0;cards()}if(stale&&data.updated)$('status').textContent='資料逾時｜'+stamp;}
let pending=false;function sync(){if(!config||pending)return;let u;try{u=new URL(config.url);if(u.origin!=='https://script.google.com'||!/^\/macros\/s\/[\w-]+\/exec$/.test(u.pathname))throw Error('網址錯誤')}catch{setup();return;}pending=true;const cb='feed'+Date.now(),s=document.createElement('script');s.referrerPolicy='no-referrer';let done=false;const finish=()=>{if(done)return;done=true;pending=false;clearTimeout(timer);s.remove();delete window[cb]};window[cb]=x=>{try{if(x?.error){$('status').textContent=x.error;if(x.error==='讀取金鑰無效'){data={ann:[],cards:[],ranking:{},calculating:true};isStale=true;lastContact=0;announce();ranks();cards();}return;}if(x?.unchanged&&x.rev===data.rev){data.updated=x.updated;data.errors=x.errors||[];data.syncMinutes=x.syncMinutes||1;lastContact=Date.now();$('status').textContent=(data.errors.length?'部分資料待確認｜':'同步 ')+data.updated;healthStatus();return;}if(x&&Array.isArray(x.ann)&&Array.isArray(x.cards)){const changedA=JSON.stringify(data.ann)!==JSON.stringify(x.ann),changedC=JSON.stringify(data.cards)!==JSON.stringify(x.cards),changedR=JSON.stringify([data.ranking,data.week,data.calculating])!==JSON.stringify([x.ranking,x.week,x.calculating]);data=x;lastContact=Date.now();healthStatus();if(changedA){ai=0;announce()}if(changedC){ci=0;cards()}if(changedR)ranks();if(!isStale)$('status').textContent=(x.errors||[]).length?'部分資料待確認｜'+x.updated:'同步 '+x.updated;}}finally{finish()}};u.search=new URLSearchParams({mode:'feed',key:config.key,callback:cb,rev:data.rev||'',t:Date.now()});s.src=u.href;s.onerror=()=>{$('status').textContent='連線失敗｜保留上次畫面';finish();healthStatus()};const timer=setTimeout(()=>{$('status').textContent='同步逾時｜保留上次畫面';finish();healthStatus()},20000);document.head.append(s)}announce();cards();ranks();sync();setInterval(sync,15000);setInterval(healthStatus,10000);setInterval(()=>{if((data.ann||[]).length>1){ai++;announce()}},12000);setInterval(()=>{if((data.cards||[]).length>4){ci++;cards()}},15000);setInterval(()=>{gi=(gi+1)%3;ranks()},6000);
</script></body></html>
